<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mumbai Home Finder — Mumbai, Thane &amp; Navi Mumbai</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg:#0b1120; --surface:#111827; --card:#162033; --hover:#1c2942; --border:#24324a; --text:#f1f5f9; --muted:#94a3b8; --pri:#0ea5e9; --pri-s:rgba(14,165,233,.14); --grn:#10b981; --grn-s:rgba(16,185,129,.14); --amb:#f59e0b; --amb-s:rgba(245,158,11,.14); --red:#ef4444; --red-s:rgba(239,68,68,.14); --sh:0 12px 32px rgba(0,0,0,.45); }
    [data-theme="light"] { --bg:#f8fafc; --surface:#fff; --card:#fff; --hover:#f1f5f9; --border:#dbe3ee; --text:#0f172a; --muted:#475569; --pri:#0284c7; --pri-s:rgba(2,132,199,.10); --grn:#059669; --grn-s:rgba(5,150,105,.10); --amb:#d97706; --amb-s:rgba(217,119,6,.12); --red:#dc2626; --red-s:rgba(220,38,38,.10); --sh:0 10px 28px rgba(15,23,42,.14); }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; }
    body { background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:15px; }
    header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; z-index:20; }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-icon { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#0ea5e9,#10b981); display:grid; place-items:center; color:#fff; font-weight:800; }
    .brand h1 { font-size:16.5px; font-weight:700; }
    .brand small { display:block; font-size:12px; color:var(--muted); }
    .seg { display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:3px; gap:2px; }
    .seg button { border:none; background:transparent; color:var(--muted); padding:6px 13px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; }
    .seg button.active { background:var(--pri); color:#fff; }
    .top-actions { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .btn { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 11px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; min-height:35px; text-decoration:none; }
    .btn:hover { background:var(--hover); }
    .btn.active { background:var(--pri-s); color:var(--pri); border-color:var(--pri); }
    .btn.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
    .btn.wa { background:#16a34a; color:#fff; border-color:#16a34a; }
    .pill { background:var(--pri); color:#fff; border-radius:999px; padding:1px 6px; font-size:11px; }
    .filters { background:var(--surface); border-bottom:1px solid var(--border); padding:9px 16px; display:flex; flex-direction:column; gap:8px; z-index:15; }
    .frow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .swrap { flex:1 1 220px; }
    .swrap input, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:9px; padding:8px 10px; font-size:13.5px; }
    select { width:auto; cursor:pointer; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .chip { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:500; cursor:pointer; }
    .chip.active { background:var(--pri); color:#fff; border-color:var(--pri); font-weight:600; }
    .chip.reset { color:var(--red); border-color:var(--red-s); }
    .ws { flex:1; display:flex; min-height:0; position:relative; }
    #listPane { width:420px; max-width:100%; background:var(--bg); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; }
    .lhead { padding:9px 14px; display:flex; justify-content:space-between; border-bottom:1px solid var(--border); font-size:12.5px; color:var(--muted); background:var(--surface); }
    #cardList { flex:1; overflow-y:auto; padding:11px; display:flex; flex-direction:column; gap:9px; }
    #mapPane { flex:1; position:relative; min-height:0; }
    #map { width:100%; height:100%; background:#070b14; }
    [data-theme="light"] #map { background:#e2e8f0; }
    body.view-map #listPane, body.view-list #mapPane { display:none; }
    body.view-list #listPane { width:100%; border-right:none; }
    body.view-list #cardList { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); align-content:start; }
    .hc { background:var(--card); border:1px solid var(--border); border-radius:11px; padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:7px; }
    .hc:hover, .hc.sel { border-color:var(--pri); }
    .hc-top { display:flex; justify-content:space-between; align-items:start; gap:8px; }
    .hc-name { font-size:15px; font-weight:700; }
    .hc-loc { font-size:12px; color:var(--muted); margin-top:2px; }
    .hc-price { text-align:right; flex-shrink:0; }
    .hc-price strong { font-size:15.5px; color:var(--pri); display:block; }
    .hc-price span { font-size:11px; color:var(--muted); }
    .tags { display:flex; flex-wrap:wrap; gap:5px; }
    .tag { font-size:11.5px; padding:3px 7px; border-radius:6px; background:var(--bg); color:var(--muted); border:1px solid var(--border); }
    .tag.g { background:var(--grn-s); color:var(--grn); border-color:transparent; }
    .tag.a { background:var(--amb-s); color:var(--amb); border-color:transparent; }
    .tag.r { background:var(--red-s); color:var(--red); border-color:transparent; }
    .tag.b { background:var(--pri-s); color:var(--pri); border-color:transparent; }
    .hc-foot { display:flex; justify-content:space-between; align-items:center; padding-top:6px; border-top:1px solid var(--border); }
    .mbtn { background:transparent; border:1px solid var(--border); color:var(--text); border-radius:7px; padding:4px 8px; font-size:12px; font-weight:600; cursor:pointer; }
    .mbtn.sv { background:var(--red-s); color:var(--red); border-color:var(--red); }
    .mbtn.cm { background:var(--pri-s); color:var(--pri); border-color:var(--pri); }
    #backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:900; }
    #drawer { position:fixed; top:0; right:0; width:450px; max-width:100%; height:100vh; background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--sh); z-index:950; display:none; flex-direction:column; }
    .dhead { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:start; gap:8px; }
    .dbody { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
    .box { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:11px; }
    .box h3 { font-size:12px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; letter-spacing:.4px; }
    .g2 { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .met { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px; }
    .met small { display:block; font-size:11px; color:var(--muted); }
    .met strong { font-size:14.5px; display:block; margin-top:2px; }
    .rev { background:var(--bg); border-left:3px solid var(--amb); padding:7px 9px; border-radius:5px; font-size:12.5px; line-height:1.4; margin-top:6px; }
    textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px; font-size:13px; }
    .plinks { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .plinks a { text-align:center; text-decoration:none; padding:8px; border-radius:8px; background:var(--bg); color:var(--pri); border:1px solid var(--border); font-size:12.5px; font-weight:600; }
    #cmpModal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; place-items:center; z-index:1000; padding:14px; }
    .mcard { background:var(--surface); border:1px solid var(--border); border-radius:13px; width:900px; max-width:100%; max-height:88vh; overflow:auto; padding:16px; box-shadow:var(--sh); }
    table.ctbl { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    table.ctbl th, table.ctbl td { border:1px solid var(--border); padding:8px 9px; text-align:left; }
    table.ctbl th { background:var(--card); color:var(--muted); }
    .legend { position:absolute; bottom:14px; left:14px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:7px 11px; font-size:12px; display:flex; gap:10px; z-index:500; box-shadow:var(--sh); flex-wrap:wrap; }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:4px; }
    .empty { text-align:center; padding:32px 14px; color:var(--muted); }
    @media (max-width:900px) { #listPane { width:100%; border-right:none; } body.view-split #mapPane, body.view-map #listPane { display:none; } body.view-map #mapPane { display:block; } .desk { display:none !important; } }
  </style>
</head>
<body class="view-split">
  <header>
    <div class="brand">
      <div class="brand-icon">M</div>
      <div><h1>Mumbai Home Finder</h1><small id="freshBadge">Loading Mumbai, Thane &amp; Navi Mumbai...</small></div>
    </div>
    <div class="seg"><button id="modeRent" class="active">Rent</button><button id="modeBuy">Buy</button></div>
    <div class="top-actions">
      <div class="seg"><button id="viewSplit" class="active desk">Split</button><button id="viewList">List</button><button id="viewMap">Map</button></div>
      <button id="savedBtn" class="btn">❤️ Saved <span class="pill" id="savedCount">0</span></button>
      <button id="compareBtn" class="btn">⚖️ Compare <span class="pill" id="cmpCount">0</span></button>
      <button id="themeBtn" class="btn">☀️ Day</button>
    </div>
  </header>

  <section class="filters">
    <div class="frow">
      <div class="swrap"><input id="searchBox" type="text" placeholder="Search area, society or builder (e.g. Bandra, Powai, Hiranandani)..." /></div>
      <select id="zoneSelect">
        <option value="ALL">All Areas (Mumbai + Thane + Navi Mumbai)</option>
        <option>South Mumbai</option><option>Bandra-Santacruz</option><option>Andheri-Juhu</option>
        <option>Western Suburbs North</option><option>Powai-Central</option><option>Chembur-Wadala</option>
        <option>Thane</option><option>Navi Mumbai</option>
      </select>
      <select id="bhkSelect"><option value="ALL">Any BHK</option><option value="1">1 BHK</option><option value="2">2 BHK</option><option value="3">3 BHK</option><option value="4">4+ BHK</option></select>
      <select id="budgetSelect"></select>
      <select id="sortSelect"><option value="rec">Sort: Best Match</option><option value="p_asc">Price: Low to High</option><option value="p_desc">Price: High to Low</option><option value="metro">Closest to Metro</option><option value="rate">Top Google Rated</option></select>
    </div>
    <div class="chips">
      <button class="chip" id="cMetro">🚇 Near Metro (≤10 min)</button>
      <button class="chip" id="cZero">💸 Zero Brokerage</button>
      <button class="chip" id="cFlood">☔ Monsoon Safe</button>
      <button class="chip" id="cRate">⭐ 4★+ Google Rated</button>
      <button class="chip active" id="cShowMetro">Metro Lines</button>
      <button class="chip" id="cShowFlood">Flood Zones</button>
      <button class="chip" id="exportBtn">⬇️ Export Excel/CSV</button>
      <button class="chip reset" id="resetBtn" style="display:none;">✕ Clear Filters</button>
    </div>
  </section>

  <main class="ws">
    <aside id="listPane">
      <div class="lhead"><span id="resSum">Showing 0 homes</span><span>Tap any home for details</span></div>
      <div id="cardList"></div>
    </aside>
    <section id="mapPane">
      <div id="map"></div>
      <div class="legend"><span><i class="dot" style="background:#10b981"></i>Zero-Brokerage</span><span><i class="dot" style="background:#0ea5e9"></i>Listed Society</span><span><i class="dot" style="background:#f59e0b"></i>4★+ Google Rated</span></div>
    </section>
  </main>

  <div id="backdrop"></div>
  <aside id="drawer">
    <div class="dhead"><div><h2 id="dName" style="font-size:18px;"></h2><div id="dSub" style="font-size:12.5px;color:var(--muted);margin-top:3px;"></div></div><button class="btn" id="closeDrawer">✕ Close</button></div>
    <div class="dbody" id="dBody"></div>
  </aside>

  <div id="cmpModal">
    <div class="mcard">
      <div style="display:flex;justify-content:space-between;align-items:center;"><h2 style="font-size:17px;">Side-by-Side Comparison</h2><div style="display:flex;gap:7px;"><button class="btn" id="clearCmp">Clear</button><button class="btn primary" id="closeCmp">Done</button></div></div>
      <div id="cmpBody"></div>
    </div>
  </div>

  <script>
    const RENT_B = [{v:0,l:"Any Rent Budget"},{v:35000,l:"Up to ₹35k/mo"},{v:50000,l:"Up to ₹50k/mo"},{v:75000,l:"Up to ₹75k/mo"},{v:100000,l:"Up to ₹1L/mo"},{v:150000,l:"Up to ₹1.5L/mo"},{v:250000,l:"Up to ₹2.5L/mo"},{v:400000,l:"Up to ₹4L/mo"}];
    const BUY_B = [{v:0,l:"Any Buy Budget"},{v:10000000,l:"Up to ₹1 Cr"},{v:20000000,l:"Up to ₹2 Cr"},{v:35000000,l:"Up to ₹3.5 Cr"},{v:50000000,l:"Up to ₹5 Cr"},{v:100000000,l:"Up to ₹10 Cr"}];
    const st = { mode:"rent", theme:localStorage.getItem("mhf_t")||"dark", metro:false, zero:false, flood:false, rate:false, savedOnly:false, showMetro:true, showFlood:false, page:36, sel:null, cmp:[], saved:JSON.parse(localStorage.getItem("mhf_s3")||'{"ids":[],"notes":{}}') };
    let societies = [], filtered = [];

    const map = L.map("map", { preferCanvas: true }).setView([19.085, 72.905], 11);
    const darkT = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom:19, attribution:"&copy; OSM & CARTO" });
    const lightT = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { maxZoom:19, attribution:"&copy; OSM & CARTO" });
    const cv = L.canvas({ padding: 0.5 });
    const mLayer = L.layerGroup().addTo(map), metroL = L.layerGroup().addTo(map), floodL = L.layerGroup();

    [
      { n:"Aqua Line 3 (Aarey-Cuffe Parade)", c:"#06b6d4", p:[[19.1365,72.8748],[19.1082,72.8800],[19.0817,72.8482],[19.0653,72.8644],[19.0218,72.8414],[19.0074,72.8195],[18.9696,72.8193],[18.9352,72.8273],[18.9142,72.8213]] },
      { n:"Blue Line 1 (Versova-Ghatkopar)", c:"#3b82f6", p:[[19.1307,72.8213],[19.1207,72.8481],[19.1082,72.8800],[19.0867,72.9082]] },
      { n:"Yellow/Red Lines 2A & 7", c:"#f59e0b", p:[[19.2288,72.8468],[19.1862,72.8358],[19.1469,72.8347],[19.1301,72.8306],[19.1190,72.8559],[19.1665,72.8576]] },
      { n:"Navi Mumbai Metro Line 1", c:"#a855f7", p:[[19.0185,73.0394],[19.0359,73.0631],[19.0548,73.0686],[19.0620,73.0715],[19.0772,73.0977]] }
    ].forEach(l => L.polyline(l.p, { color:l.c, weight:3, opacity:.7, renderer:cv }).bindTooltip(l.n).addTo(metroL));

    [
      { n:"Hindmata", la:19.0079, ln:72.8423, r:650 }, { n:"Sion Gandhi Market", la:19.0322, ln:72.8576, r:700 },
      { n:"Milan Subway", la:19.0853, ln:72.8439, r:550 }, { n:"Andheri Subway", la:19.1157, ln:72.8442, r:550 },
      { n:"Kurla LBS", la:19.0764, ln:72.8832, r:800 }, { n:"Malad Subway", la:19.1846, ln:72.8468, r:500 }
    ].forEach(s => L.circle([s.la, s.ln], { radius:s.r, color:"#ef4444", fillColor:"#ef4444", fillOpacity:.16, weight:1, renderer:cv }).bindTooltip("Flood Zone: " + s.n).addTo(floodL));

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    const fmt = (v, buy) => !v ? "On request" : (buy ? (v>=1e7 ? `₹${(v/1e7).toFixed(2)} Cr` : `₹${(v/1e5).toFixed(1)} L`) : (v>=1e5 ? `₹${(v/1e5).toFixed(2)} L/mo` : `₹${Math.round(v).toLocaleString("en-IN")}/mo`));
    const getP = s => st.mode === "rent" ? (s.pricing?.rent_monthly_inr?.median || 0) : (s.pricing?.buy_inr?.median || 0);
    const isEst = s => st.mode === "rent" ? !!s.pricing?.rent_monthly_inr?.is_estimate : !!s.pricing?.buy_inr?.is_estimate;

    function applyTheme(t) {
      st.theme = t; localStorage.setItem("mhf_t", t); document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeBtn").textContent = t === "dark" ? "☀️ Day" : "🌙 Night";
      if (t === "dark") { map.removeLayer(lightT); darkT.addTo(map); } else { map.removeLayer(darkT); lightT.addTo(map); }
    }
    function fillBudgets() {
      document.getElementById("budgetSelect").innerHTML = (st.mode === "rent" ? RENT_B : BUY_B).map(o => `<option value="${o.v}">${o.l}</option>`).join("");
    }
    function syncCounts() {
      localStorage.setItem("mhf_s3", JSON.stringify(st.saved));
      document.getElementById("savedCount").textContent = st.saved.ids.length;
      document.getElementById("cmpCount").textContent = st.cmp.length;
    }

    function renderAll() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      const z = document.getElementById("zoneSelect").value, b = document.getElementById("bhkSelect").value;
      const mb = Number(document.getElementById("budgetSelect").value || 0), srt = document.getElementById("sortSelect").value;
      const anyF = !!(q || z!=="ALL" || b!=="ALL" || mb>0 || st.metro || st.zero || st.flood || st.rate || st.savedOnly);
      document.getElementById("resetBtn").style.display = anyF ? "inline-flex" : "none";

      filtered = societies.filter(s => {
        if (z !== "ALL" && s.zone !== z) return false;
        if (q && !`${s.name} ${s.locality} ${s.zone} ${(s.rera_ids||[]).join(" ")}`.toLowerCase().includes(q)) return false;
        if (b !== "ALL" && s.bhks?.length && (Number(b)===4 ? !s.bhks.some(x=>x>=4) : !s.bhks.includes(Number(b)))) return false;
        const p = getP(s);
        if (mb > 0 && (!p || p > mb)) return false;
        if (st.metro && (s.mumbai_context?.nearest_metro?.walk_min || 999) > 10) return false;
        if (st.zero && !s.pricing?.has_zero_brokerage) return false;
        if (st.flood && s.mumbai_context?.monsoon_flood_risk === "high") return false;
        if (st.rate && (s.google?.rating || 0) < 4.0) return false;
        if (st.savedOnly && !st.saved.ids.includes(s.id)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        if (srt === "p_asc") return (getP(a)||9e12) - (getP(b)||9e12);
        if (srt === "p_desc") return (getP(b)||0) - (getP(a)||0);
        if (srt === "metro") return (a.mumbai_context?.nearest_metro?.walk_min||999) - (b.mumbai_context?.nearest_metro?.walk_min||999);
        if (srt === "rate") return (b.google?.rating||0) - (a.google?.rating||0);
        const sc = x => (isEst(x)?0:12) + (x.google?.rating||0)*3 + (x.pricing?.has_zero_brokerage?8:0) + Object.keys(x.sources||{}).length*3 - Math.min(20,(x.mumbai_context?.nearest_metro?.walk_min||20)*.3);
        return sc(b) - sc(a);
      });

      document.getElementById("resSum").textContent = `Showing ${filtered.length.toLocaleString("en-IN")} of ${societies.length.toLocaleString("en-IN")} homes`;
      renderMap(); renderList();
    }

    function renderMap() {
      mLayer.clearLayers();
      const mset = new Set(filtered.map(s => s.id));
      for (const s of societies) {
        const ok = mset.has(s.id);
        const col = !ok ? "#64748b" : (s.pricing?.has_zero_brokerage ? "#10b981" : ((s.google?.rating||0)>=4 ? "#f59e0b" : "#0ea5e9"));
        const mk = L.circleMarker([s.lat, s.lng], { renderer:cv, radius:s.id===st.sel?9:(ok?6:3), color:s.id===st.sel?"#fff":col, fillColor:col, fillOpacity:ok?.85:.16, weight:s.id===st.sel?2.5:1.5 });
        mk.bindTooltip(`<b>${esc(s.name)}</b><br/>${esc(s.locality)} • ${fmt(getP(s), st.mode==="buy")}`);
        mk.on("click", () => openDetail(s));
        mk.addTo(mLayer);
      }
    }

    function renderList() {
      const box = document.getElementById("cardList");
      if (!filtered.length) { box.innerHTML = `<div class="empty"><p>No homes match these filters.</p><button class="btn primary" onclick="resetAll()">Clear Filters</button></div>`; return; }
      const sl = filtered.slice(0, st.page);
      box.innerHTML = sl.map(s => {
        const ctx = s.mumbai_context||{}, g = s.google, fl = ctx.monsoon_flood_risk||"low";
        const ft = fl==="high" ? `<span class="tag r">⚠️ Flood Zone</span>` : (fl==="moderate" ? `<span class="tag a">☔ Moderate Rain</span>` : `<span class="tag g">☔ Monsoon Safe</span>`);
        const isS = st.saved.ids.includes(s.id), isC = st.cmp.includes(s.id);
        return `<article class="hc ${s.id===st.sel?"sel":""}" data-id="${esc(s.id)}">
          <div class="hc-top"><div><div class="hc-name">${esc(s.name)}</div><div class="hc-loc">${esc(s.locality)} • ${esc(s.zone)}</div></div>
          <div class="hc-price"><strong>${fmt(getP(s), st.mode==="buy")}</strong><span>${isEst(s)?"Estimated":(s.rera_carpet_sqft?s.rera_carpet_sqft+" sq ft":st.mode.toUpperCase())}</span></div></div>
          <div class="tags">${s.bhks?.length?`<span class="tag b">${s.bhks.map(x=>x+" BHK").join(" • ")}</span>`:""}${g?.rating?`<span class="tag a">★ ${g.rating} (${g.review_count||0})</span>`:""}${s.pricing?.has_zero_brokerage?`<span class="tag g">💸 Zero Brokerage</span>`:""}${ctx.nearest_metro?`<span class="tag">🚇 ${ctx.nearest_metro.walk_min}m ${esc(ctx.nearest_metro.name)}</span>`:""}${ft}</div>
          <div class="hc-foot"><span style="font-size:12px;color:var(--muted);">🚆 ${esc(ctx.nearest_local?.name||"Local")} (${ctx.nearest_local?.walk_min||"—"}m)</span>
          <div style="display:flex;gap:5px;"><button class="mbtn ${isS?"sv":""}" data-a="sv">${isS?"❤️ Saved":"🤍 Save"}</button><button class="mbtn ${isC?"cm":""}" data-a="cm">${isC?"✓ Compare":"⚖️ Compare"}</button></div></div></article>`;
      }).join("") + (filtered.length > st.page ? `<button class="btn" id="moreBtn" style="width:100%;justify-content:center;">Show More (${filtered.length - st.page} left)</button>` : "");

      box.querySelectorAll(".hc").forEach(el => {
        el.onclick = e => {
          const b = e.target.closest("button[data-a]"), id = el.dataset.id;
          if (b) { e.stopPropagation(); if (b.dataset.a==="sv") toggleSave(id); else toggleCmp(id); return; }
          const s = societies.find(x => x.id === id);
          if (s) { map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), { duration:.5 }); openDetail(s); }
        };
      });
      const mb = document.getElementById("moreBtn");
      if (mb) mb.onclick = () => { st.page += 36; renderList(); };
    }

    function toggleSave(id) {
      const i = st.saved.ids.indexOf(id);
      if (i >= 0) st.saved.ids.splice(i, 1); else st.saved.ids.push(id);
      syncCounts(); renderAll();
      if (st.sel === id) { const s = societies.find(x => x.id === id); if (s) openDetail(s); }
    }
    function toggleCmp(id) {
      const i = st.cmp.indexOf(id);
      if (i >= 0) st.cmp.splice(i, 1); else if (st.cmp.length < 3) st.cmp.push(id); else alert("Compare up to 3 homes at once.");
      syncCounts(); renderList();
    }

    function openDetail(s) {
      st.sel = s.id;
      const p = s.pricing||{}, ctx = s.mumbai_context||{}, g = s.google||{}, pr = p.by_portal||{};
      const q = encodeURIComponent(`${s.name} ${s.locality} Mumbai`);
      const isS = st.saved.ids.includes(s.id), isC = st.cmp.includes(s.id);
      const rent = p.rent_monthly_inr?.median, buy = p.buy_inr?.median;
      const share = `${location.origin}${location.pathname}?open=${encodeURIComponent(s.id)}`;
      const wa = encodeURIComponent(`🏠 *${s.name}* (${s.locality}, ${s.zone})\n• Rent: ${fmt(rent,false)} | Buy: ${fmt(buy,true)}\n• Metro: ${ctx.nearest_metro?.walk_min||"?"}m to ${ctx.nearest_metro?.name||"Metro"}\n• Monsoon: ${(ctx.monsoon_flood_risk||"low").toUpperCase()}\n${g.rating?`• Google: ${g.rating}★ (${g.review_count||0} reviews)\n`:""}Link: ${share}`);

      document.getElementById("dName").textContent = s.name;
      document.getElementById("dSub").textContent = `${s.locality} • ${s.zone}${g.rating?` • ★ ${g.rating} (${g.review_count||0} Google reviews)`:""}`;
      document.getElementById("dBody").innerHTML = `
        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <button class="btn ${isS?"active":""}" id="dSv">${isS?"❤️ Saved":"🤍 Save"}</button>
          <button class="btn ${isC?"active":""}" id="dCm">${isC?"✓ Compare":"⚖️ Compare"}</button>
          <a class="btn wa" target="_blank" href="https://wa.me/?text=${wa}">📲 Share on WhatsApp</a>
        </div>
        ${s.coords_approx?`<div style="font-size:12px;color:var(--amb);background:var(--amb-s);padding:7px 9px;border-radius:8px;">📍 Approx. locality pin — tap <b>Google Maps Directions</b> below for the exact gate.</div>`:""}
        <div class="box"><h3>Price &amp; Size</h3><div class="g2">
          <div class="met"><small>Monthly Rent ${p.rent_monthly_inr?.is_estimate?"(Est.)":""}</small><strong>${fmt(rent,false)}</strong></div>
          <div class="met"><small>Purchase Price ${p.buy_inr?.is_estimate?"(Est.)":""}</small><strong>${fmt(buy,true)}</strong></div>
          <div class="met"><small>BHKs</small><strong>${s.bhks?.length?s.bhks.map(x=>x+" BHK").join(", "):"Check portals"}</strong></div>
          <div class="met"><small>Carpet / Rate</small><strong>${s.rera_carpet_sqft?s.rera_carpet_sqft+" sq ft":"—"} ${p.price_per_carpet_sqft?`(₹${p.price_per_carpet_sqft.toLocaleString("en-IN")}/sf)`:""}</strong></div>
        </div>${p.move_in_cash_nobroker?`<div style="margin-top:8px;padding:9px;border-radius:8px;background:var(--grn-s);font-size:12.5px;line-height:1.45;"><strong>Upfront Move-In Cash (Rent):</strong><br/>• Direct / NoBroker: <b>${fmt(p.move_in_cash_nobroker,true)}</b><br/>• Via Broker: <b>${fmt(p.move_in_cash_broker,true)}</b></div>`:""}</div>
        <div class="box"><h3>Transit &amp; Monsoon Safety</h3><div class="g2">
          <div class="met"><small>Nearest Metro (2026)</small><strong>${esc(ctx.nearest_metro?.name||"—")}</strong><small>${ctx.nearest_metro?.walk_min||"—"}m walk • ${esc(ctx.nearest_metro?.line||"")}</small></div>
          <div class="met"><small>Nearest Local Train</small><strong>${esc(ctx.nearest_local?.name||"—")}</strong><small>${ctx.nearest_local?.walk_min||"—"}m walk</small></div>
          <div class="met"><small>Monsoon Flood Risk</small><strong style="color:${ctx.monsoon_flood_risk==="high"?"var(--red)":(ctx.monsoon_flood_risk==="moderate"?"var(--amb)":"var(--grn)")}">${(ctx.monsoon_flood_risk||"low").toUpperCase()}</strong></div>
          <div class="met"><small>MahaRERA</small><strong>${s.rera_ids?.length?esc(s.rera_ids[0]):"Verify via link"}</strong></div>
        </div>${ctx.commute_hubs_min?`<div style="margin-top:8px;font-size:12px;color:var(--muted);"><b>Peak Commute:</b> BKC ~${ctx.commute_hubs_min.bkc}m • Lower Parel ~${ctx.commute_hubs_min.lower_parel}m • Andheri/SEEPZ ~${ctx.commute_hubs_min.andheri_seepz}m • Powai ~${ctx.commute_hubs_min.powai}m</div>`:""}</div>
        <div class="box"><h3>Portal Price Breakdown</h3><div class="g2">${["magicbricks","nobroker","99acres","housing"].map(k=>`<div class="met"><small style="text-transform:uppercase;">${k}</small><strong>${fmt(st.mode==="rent"?pr[k]?.rent_median:pr[k]?.buy_median, st.mode==="buy")}</strong><small>${pr[k]?.count?pr[k].count+" listing(s)":"Open link below"}</small></div>`).join("")}</div></div>
        ${g.reviews?.length?`<div class="box"><h3>Google Resident Reviews</h3>${g.reviews.map(r=>`<div class="rev"><b>★ ${r.rating||""}</b> — ${esc(r.text)}</div>`).join("")}</div>`:""}
        <div class="box"><h3>Your Personal Visit / Broker Notes</h3><textarea id="dNote" rows="3" placeholder="Broker phone, floor, sunlight, water pressure...">${esc(st.saved.notes[s.id]||"")}</textarea></div>
        <div class="box"><h3>Open Directly on Portals &amp; Maps</h3><div class="plinks">
          <a target="_blank" href="${g.url||`https://www.google.com/maps/search/?api=1&query=${q}`}">📍 Google Maps</a>
          <a target="_blank" href="${s.sources?.magicbricks||`https://www.magicbricks.com/property-for-rent/residential-real-estate?keyword=${q}`}">MagicBricks</a>
          <a target="_blank" href="${s.sources?.nobroker||`https://www.nobroker.in/flats-for-rent-in-${s.locality.toLowerCase().replace(/\s+/g,'_')}_mumbai`}">NoBroker</a>
          <a target="_blank" href="${s.sources?.["99acres"]||`https://www.99acres.com/property-in-${s.locality.toLowerCase().replace(/\s+/g,'-')}-mumbai-ffid`}">99acres</a>
          <a target="_blank" href="https://housing.com/in/rent/searches?q=${q}">Housing.com</a>
          <a target="_blank" href="https://maharera.maharashtra.gov.in/projects-search-result?project_name=${q}">MahaRERA</a>
        </div></div>`;
      document.getElementById("backdrop").style.display = "block";
      document.getElementById("drawer").style.display = "flex";
      document.getElementById("dSv").onclick = () => toggleSave(s.id);
      document.getElementById("dCm").onclick = () => { toggleCmp(s.id); openDetail(s); };
      document.getElementById("dNote").oninput = e => { st.saved.notes[s.id] = e.target.value; syncCounts(); };
      renderMap();
    }
    const closeD = () => { document.getElementById("backdrop").style.display = "none"; document.getElementById("drawer").style.display = "none"; };
    function openCmp() {
      const items = st.cmp.map(id => societies.find(x => x.id === id)).filter(Boolean);
      const row = (l, fn) => `<tr><th>${l}</th>${items.map(s => `<td>${fn(s)}</td>`).join("")}</tr>`;
      document.getElementById("cmpBody").innerHTML = !items.length ? `<div class="empty"><p>Tap <b>⚖️ Compare</b> on up to 3 homes.</p></div>` : `<table class="ctbl">
        <tr><th>Feature</th>${items.map(s=>`<th>${esc(s.name)}<br/><small>${esc(s.locality)}</small></th>`).join("")}</tr>
        ${row("Rent", s=>fmt(s.pricing?.rent_monthly_inr?.median,false))} ${row("Buy", s=>fmt(s.pricing?.buy_inr?.median,true))}
        ${row("Move-In (Direct)", s=>fmt(s.pricing?.move_in_cash_nobroker,true))} ${row("BHKs", s=>s.bhks?.length?s.bhks.map(x=>x+" BHK").join(", "):"—")}
        ${row("Carpet", s=>s.rera_carpet_sqft?s.rera_carpet_sqft+" sq ft":"—")} ${row("Google", s=>s.google?.rating?`★ ${s.google.rating}`:"—")}
        ${row("Metro", s=>s.mumbai_context?.nearest_metro?`${esc(s.mumbai_context.nearest_metro.name)} (${s.mumbai_context.nearest_metro.walk_min}m)`:"—")}
        ${row("Flood Risk", s=>(s.mumbai_context?.monsoon_flood_risk||"low").toUpperCase())}</table>`;
      document.getElementById("cmpModal").style.display = "grid";
    }
    function resetAll() {
      ["searchBox"].forEach(id=>document.getElementById(id).value="");
      ["zoneSelect","bhkSelect"].forEach(id=>document.getElementById(id).value="ALL");
      document.getElementById("budgetSelect").value="0"; document.getElementById("sortSelect").value="rec";
      st.metro = st.zero = st.flood = st.rate = st.savedOnly = false; st.page = 36;
      ["cMetro","cZero","cFlood","cRate","savedBtn"].forEach(id=>document.getElementById(id).classList.remove("active"));
      renderAll();
    }
    function setView(v) {
      document.body.className = "view-" + v;
      ["viewSplit","viewList","viewMap"].forEach(id=>document.getElementById(id).classList.remove("active"));
      document.getElementById("view"+v[0].toUpperCase()+v.slice(1)).classList.add("active");
      setTimeout(()=>map.invalidateSize(), 80);
    }

    document.getElementById("modeRent").onclick = () => { st.mode="rent"; document.getElementById("modeRent").classList.add("active"); document.getElementById("modeBuy").classList.remove("active"); fillBudgets(); renderAll(); };
    document.getElementById("modeBuy").onclick = () => { st.mode="buy"; document.getElementById("modeBuy").classList.add("active"); document.getElementById("modeRent").classList.remove("active"); fillBudgets(); renderAll(); };
    document.getElementById("viewSplit").onclick = () => setView("split");
    document.getElementById("viewList").onclick = () => setView("list");
    document.getElementById("viewMap").onclick = () => setView("map");
    document.getElementById("themeBtn").onclick = () => applyTheme(st.theme==="dark"?"light":"dark");
    document.getElementById("savedBtn").onclick = e => { st.savedOnly=!st.savedOnly; e.currentTarget.classList.toggle("active", st.savedOnly); renderAll(); };
    document.getElementById("compareBtn").onclick = openCmp;
    document.getElementById("closeCmp").onclick = () => document.getElementById("cmpModal").style.display="none";
    document.getElementById("clearCmp").onclick = () => { st.cmp=[]; syncCounts(); openCmp(); renderList(); };
    document.getElementById("closeDrawer").onclick = closeD; document.getElementById("backdrop").onclick = closeD;
    document.getElementById("resetBtn").onclick = resetAll;
    [["cMetro","metro"],["cZero","zero"],["cFlood","flood"],["cRate","rate"]].forEach(([id,k]) => { document.getElementById(id).onclick = e => { st[k]=!st[k]; e.currentTarget.classList.toggle("active",st[k]); st.page=36; renderAll(); }; });
    document.getElementById("cShowMetro").onclick = e => { st.showMetro=!st.showMetro; e.currentTarget.classList.toggle("active",st.showMetro); if(st.showMetro) metroL.addTo(map); else map.removeLayer(metroL); };
    document.getElementById("cShowFlood").onclick = e => { st.showFlood=!st.showFlood; e.currentTarget.classList.toggle("active",st.showFlood); if(st.showFlood) floodL.addTo(map); else map.removeLayer(floodL); };
    ["searchBox","zoneSelect","bhkSelect","budgetSelect","sortSelect"].forEach(id => document.getElementById(id).addEventListener("input", () => { st.page=36; renderAll(); }));
    document.getElementById("exportBtn").onclick = () => {
      const rows = [["Society","Zone","Locality","BHKs","Carpet","Rent_INR","Buy_INR","Google","Metro","Walk_Min","Flood"]];
      filtered.forEach(s => rows.push([`"${(s.name||"").replace(/"/g,'""')}"`,`"${s.zone||""}"`,`"${s.locality||""}"`,`"${(s.bhks||[]).join('/')}"`,s.rera_carpet_sqft||"",s.pricing?.rent_monthly_inr?.median||"",s.pricing?.buy_inr?.median||"",s.google?.rating||"",`"${s.mumbai_context?.nearest_metro?.name||""}"`,s.mumbai_context?.nearest_metro?.walk_min||"",s.mumbai_context?.monsoon_flood_risk||""]));
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"})); a.download="mumbai-home-finder.csv"; a.click();
    };
    document.addEventListener("keydown", e => { if (e.key==="Escape") { closeD(); document.getElementById("cmpModal").style.display="none"; } if (e.key==="/" && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("searchBox").focus(); } });

    applyTheme(st.theme); fillBudgets(); syncCounts();
    if (window.innerWidth <= 900) setView("list");
    fetch("./public/data/mumbai-index.json", { cache: "no-store" }).then(r => r.json()).then(d => {
      societies = d.societies || [];
      document.getElementById("freshBadge").textContent = `${societies.length.toLocaleString("en-IN")} homes • Updated ${d.generated_at}`;
      renderAll();
      const oid = new URLSearchParams(location.search).get("open");
      if (oid) { const t = societies.find(s => s.id === oid); if (t) { map.setView([t.lat, t.lng], 15); openDetail(t); } }
    }).catch(() => { document.getElementById("freshBadge").textContent = "Could not load data — refresh to retry."; });
  </script>
</body>
</html>
