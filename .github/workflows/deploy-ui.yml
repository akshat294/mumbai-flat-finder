name: Quick Deploy UI (Cloudflare Pages)

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Cloudflare Pages project name (default: bombayhomes)'
        required: true
        default: 'bombayhomes'

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy web/ + functions/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy web --project-name=${{ inputs.project_name }} --branch=production --commit-dirty=true
