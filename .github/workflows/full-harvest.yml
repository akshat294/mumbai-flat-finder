name: Full Mumbai MMR Harvest (All Portals Backfill)

on:
  workflow_dispatch:
    inputs:
      apish_max_calls:
        description: 'NEW 99acres api.sh pages to harvest (460 = ~11,000+ NEW deep flats; already-saved pages are skipped free!)'
        required: true
        default: '460'
      core_limit:
        description: 'Max listings per hub for core DIY portals (MagicBricks, NoBroker, SquareYards, Makaan)'
        required: true
        default: '220'
      force_housing_apify:
        description: 'Run a fresh high-volume Housing.com Apify sweep (Mumbai + Thane + Navi Mumbai)'
        type: boolean
        required: false
        default: true
      housing_rent_limit:
        description: 'Housing.com Apify max Rent results for Mumbai (Thane & Navi Mumbai get half each)'
        required: true
        default: '2500'
      housing_buy_limit:
        description: 'Housing.com Apify max Buy results for Mumbai (Thane & Navi Mumbai get half each)'
        required: true
        default: '1500'
      deploy_live:
        description: 'Deploy harvested inventory to bombayhomes.pages.dev after summary'
        type: boolean
        required: false
        default: true

concurrency:
  group: mumbai-mmr-daily-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  full-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -q curl_cffi

      - name: Snapshot BEFORE inventory counts
        run: |
          python -u pipeline/inventory_report.py | tee before_report.txt

      - name: Deep harvest core DIY portals (MagicBricks, NoBroker, SquareYards, Makaan, Community)
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLEPLACESAPI }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python -u run_pipeline.py --all-mmr --sources magicbricks,nobroker,squareyards,makaan,nobrokerage,community --limit ${{ inputs.core_limit }} --fresh-hours 1 --max-google-calls 40

      - name: Optionally expire Apify Housing cache timestamp if force_housing_apify=true
        if: ${{ inputs.force_housing_apify }}
        run: |
          python -c "import json; from pathlib import Path; p=Path('data/apify_cache.json'); d=json.loads(p.read_text(encoding='utf-8-sig')) if p.exists() else {}; d['last_sync']=0; p.write_text(json.dumps(d), encoding='utf-8'); print('[harvest] Marked Apify Housing cache for fresh pull')"

      - name: Full Harvest Merge (NoBroker 44-Hubs + Housing Apify MMR + 99acres api.sh Verified 72 Slices + MahaRERA + Quality Filter + Shards)
        env:
          PYTHONUNBUFFERED: "1"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_1: ${{ secrets.APIFY_TOKEN_1 }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          APIFY_TOKEN_3: ${{ secrets.APIFY_TOKEN_3 }}
          APIFY_TOKEN_4: ${{ secrets.APIFY_TOKEN_4 }}
          APIFY_TOKEN_5: ${{ secrets.APIFY_TOKEN_5 }}
          FORCE_APIFY_REFRESH: ${{ inputs.force_housing_apify && '1' || '0' }}
          APIFY_RENT_LIMIT: ${{ inputs.housing_rent_limit }}
          APIFY_BUY_LIMIT: ${{ inputs.housing_buy_limit }}
          APIFY_HOUSING_CITIES: "Mumbai,Thane,Navi Mumbai"
          APISH_KEY: ${{ secrets.APISH_KEY }}
          APISH_KEY_1: ${{ secrets.APISH_KEY_1 }}
          APISH_KEY_2: ${{ secrets.APISH_KEY_2 }}
          APISH_KEY_3: ${{ secrets.APISH_KEY_3 }}
          APISH_KEY_4: ${{ secrets.APISH_KEY_4 }}
          APISH_KEY_5: ${{ secrets.APISH_KEY_5 }}
          APISH_MAX_CALLS: ${{ inputs.apish_max_calls }}
          APISH_FULL: "1"
          APISH_RESET_QUEUE: "1"
          APISH_SKIP_RECENT_DAYS: "3"
        run: |
          python -u pipeline/post_build_v18.py

      - name: Verify final sharded build & publish Full Harvest Summary
        run: |
          python -u pipeline/verify_build.py | tee verify_out.txt
          python -u pipeline/inventory_report.py | tee after_report.txt
          {
            echo "## Full Mumbai MMR Harvest Summary"
            echo ""
            echo "### Build Verification"
            echo '```'
            cat verify_out.txt
            echo '```'
            echo ""
            echo "### Final Inventory Breakdown (All Portals Combined)"
            echo '```'
            cat after_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply HD Media Cache, Fleet Repair & CI Quality Gate (v50)
        run: |
          python -u pipeline/sync_flatmates.py
          python -u pipeline/enrich_media.py --apply-only
          python -u pipeline/fleet_repair.py
          python -u pipeline/verify_build.py

      - name: Deploy harvested inventory to Cloudflare Pages (bombayhomes)
        if: ${{ inputs.deploy_live }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy web --project-name=bombayhomes --branch=production --commit-dirty=true

      - name: Save all harvested caches, raw archives & shards to Git
        run: |
          git config user.name "mumbai-flat-finder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/google_places_cache.json data/osm_geo_cache.json data/osm_civic_cache.json data/mumbai_osm_buildings.json data/vision_tags_cache.json data/price_history.json data/apify_cache.json data/apish_99acres_cache.json data/apish_99acres_queue.json data/raw_99acres data/raw_housing data/maharera_cache.json data/seen_timestamps.json data/listing_registry.json web/public/data/manifest.json web/public/data/shards web/public/data/mumbai-societies.csv
          git diff --staged --quiet || (git commit -m "feat: full Mumbai MMR multi-portal backfill harvest" && (git pull --rebase || (git rebase --abort && git pull --no-rebase -X ours --no-edit)) && git push)
